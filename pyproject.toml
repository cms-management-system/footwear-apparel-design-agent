[project]
name = "shoe-style-agent"
version = "0.1.0"
description = "款式工场 · 鞋服智能设计 Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pillow>=12.3.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Inline SVG paths and CSS are intentionally kept as single strings.
"app/agent/technical_flat.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
